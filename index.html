<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z Dogg — Music</title>
<style>
:root{--claret:#7a1f3d;--blue:#8fb8dc;--dark:#101827}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--claret),#9a3155 48%,var(--blue));color:white;padding:28px 16px}
.wrap{max-width:620px;margin:auto}
header{text-align:center;padding:24px 10px 18px}
h1{font-size:42px;margin:0 0 8px}
p{margin:0 0 22px;opacity:.92}
.card{background:rgba(16,24,39,.88);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.song-title{font-size:20px;font-weight:700;margin-bottom:10px}
audio{width:100%}
.future{border:2px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:white}
footer{text-align:center;margin-top:24px;font-size:13px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Z Dogg</h1><p>Tap a track and listen 🎵</p></header>

<div class="card">
<div class="song-title">DAA GOAT</div>
<audio controls preload="metadata"><source src="DAA%20GOAT.m4a" type="audio/mp4"></audio>
</div>

<div class="card">
<div class="song-title">Every Part of Me</div>
<audio controls preload="metadata"><source src="AUDIO-2026-04-18-13-32-24.mp3" type="audio/mpeg"></audio>
</div>

<div class="card future"><div class="song-title">New song coming soon</div><p style="margin:0">Space reserved for a future Z Dogg track.</p></div>
<div class="card future"><div class="song-title">New song coming soon</div><p style="margin:0">Space reserved for a future Z Dogg track.</p></div>
<div class="card future"><div class="song-title">New song coming soon</div><p style="margin:0">Space reserved for a future Z Dogg track.</p></div>

<footer>Z Dogg • Music</footer>
</div>
</body>
</html>
